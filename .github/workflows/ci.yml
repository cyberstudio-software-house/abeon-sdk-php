name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.4 only. The 8.3 leg failed on every run from 2026-05-28 onwards: the lock
        # is resolved on 8.4 and pulls packages requiring >=8.4.1, so `composer install`
        # died before a single test ran. Nothing in this estate has ever run on 8.3 —
        # every container, the runbook and verify.sh are all php:8.4-cli — so the claim
        # went to match reality rather than the lock going to match the claim.
        php: ['8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, sockets, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Static analysis (PHPStan level 8)
        run: composer stan

      - name: Tests (PHPUnit)
        run: composer test
